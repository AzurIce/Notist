<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Loro / CM6 验证</title>
<style>
  body { margin: 36px auto; max-width: 1100px; padding: 0 24px; font: 16px system-ui; color: #233145; background: #f4f6f9; }
  h1 { font-size: 25px; } .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pane { padding: 20px; border: 1px solid #ccd4df; border-radius: 10px; background: white; }
  .cm-editor { min-height: 240px; border: 1px solid #dde3ea; } .cm-content { font-size: 17px; }
  button { margin-right: 8px; padding: 8px 14px; } pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<h1>Loro / CodeMirror 6 验证原型</h1>
<p>官方绑定，两个内存副本。输入与撤销通过 CM6，按钮交换 CRDT 更新。</p>
<p><button id="sync">双向同步</button><button id="undo">撤销左侧</button><button id="redo">重做左侧</button></p>
<div class="editors"><section class="pane"><h2>副本 A</h2><div id="a"></div></section><section class="pane"><h2>副本 B</h2><div id="b"></div></section></div>
<pre id="state"></pre>
<script type="module" src="/dist/browser.js"></script>
</html>
