[package]
name = "notist-editor-node-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
notist-editor-document = { path = "../editor-document" }
notist-editor-node = { path = "../editor-node", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.121"
