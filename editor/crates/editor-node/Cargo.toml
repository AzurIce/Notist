[package]
name = "notist-editor-node"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native = ["dep:anyhow", "dep:axum", "dep:tokio", "dep:tokio-util", "dep:tokio-tungstenite", "dep:futures-util", "dep:toml", "dep:redb", "dep:uuid", "dep:turn", "dep:webrtc-util", "dep:async-trait", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:axum-server", "dep:sha1", "dep:subtle", "dep:tower-http", "dep:webrtc", "dep:tempfile"]

[dependencies]
notist-editor-document = { path = "../editor-document" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { version = "1", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", optional = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }
toml = { version = "0.9", optional = true }
redb = { version = "4.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
turn = { version = "=0.17.2", optional = true }
webrtc-util = { version = "=0.17.2", optional = true }
async-trait = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
sha1 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
webrtc = { version = "=0.14.0", optional = true }
tempfile = { version = "3", optional = true }

[[bin]]
name = "notist-editor-node"
path = "src/bin/node.rs"
required-features = ["native"]

[dev-dependencies]
tempfile = "3"
