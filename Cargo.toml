[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/notist-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.11"
dunce = "1"
notify-debouncer-mini = "0.7"
open = "5"
percent-encoding = "2"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["fs"] }
notist-model = { path = "crates/notist-model" }
notist-syntax = { path = "crates/notist-syntax" }
notist-eval = { path = "crates/notist-eval" }
notist-analysis = { path = "crates/notist-analysis" }
notist-html = { path = "crates/notist-html" }
