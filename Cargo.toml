[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/notist-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.13"
dunce = "1"
flate2 = "1"
fs2 = "0.4"
lsp-server = "0.10"
lsp-types = "0.97"
notify-debouncer-mini = "0.7"
open = "5"
percent-encoding = "2"
serde = "1"
serde_json = "1"
sha2 = "0.10"
regex = "1"
tantivy = "0.26"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["fs"] }
unicode-normalization = "0.1"
notist-model = { path = "crates/notist-model" }
notist-syntax = { path = "crates/notist-syntax" }
notist-eval = { path = "crates/notist-eval" }
notist-analysis = { path = "crates/notist-analysis" }
notist-html = { path = "crates/notist-html" }
notist-service = { path = "crates/notist-service" }
