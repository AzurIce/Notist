[package]
name = "notist-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "notist"
path = "src/main.rs"

# Dense-lane backend selection: forwarded to notist-service. `dense-download`
# (default) acquires ONNX Runtime at compile time via ort's build script;
# `dense-system` dlopens a system ONNX Runtime at runtime (sandboxed/Nix
# builds pair it with onnxruntime in the environment).
[features]
default = ["dense-download"]
dense-download = ["notist-service/dense-download"]
dense-system = ["notist-service/dense-system"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
clap.workspace = true
codespan-reporting.workspace = true
dunce.workspace = true
flate2.workspace = true
fs2.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
notist-analysis.workspace = true
notist-eval.workspace = true
notist-html.workspace = true
notist-plugin-host.workspace = true
notist-service.workspace = true
notist-model.workspace = true
notist-syntax.workspace = true
open.workspace = true
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
flate2.workspace = true
sha2.workspace = true
