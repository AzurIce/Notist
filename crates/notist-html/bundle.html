<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Notist</title>
<style>main{overflow-wrap:anywhere}pre{overflow:auto}canvas,svg{max-width:100%}</style>
<main id="document"></main>
<script type="module">
import { mount } from './renderer.js';
const [content, components, attributes] = await Promise.all(
  ['content.json', 'components.json', 'attributes.json'].map(path => fetch(path).then(response => response.json()))
);
await mount(document.querySelector('main'), content, components, document.baseURI, attributes);
</script>
