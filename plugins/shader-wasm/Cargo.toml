[package]
name = "notist-plugin-shader-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
notist-plugin-sdk = { path = "../../crates/notist-plugin-sdk" }
notist-model = { path = "../../crates/notist-model" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
