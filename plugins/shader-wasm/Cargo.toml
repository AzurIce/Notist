[package]
name = "notist-plugin-shader-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
notist-plugin-sdk = { path = "../../crates/notist-plugin-sdk" }
notist-model = { path = "../../crates/notist-model" }
wit-bindgen = "0.60"

[features]
default = []
# Build as a zero-import core wasm module instead of a wasip2 component:
#   cargo build --release --features core-abi --target wasm32-unknown-unknown
core-abi = []

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
